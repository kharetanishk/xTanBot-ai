<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#09090b" />
    <title>xTanBot — your AI assistant who picks up the phone</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style id="expo-reset">
      /* App is dark-only: paint the page behind it the same color so overscroll/bounce
         and the mobile toolbar resize never reveal a white strip. */
      html,
      body {
        height: 100%;
        background-color: #09090b;
        overscroll-behavior: none;
      }
      /* Disable body scrolling; screens scroll inside their own ScrollView */
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
