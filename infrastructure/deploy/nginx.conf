# cp to /etc/nginx/sites-available/xtanbot, symlink into sites-enabled,
# then: certbot --nginx -d xtanbot.lunarnodes.co.in -d xtanbot-api.lunarnodes.co.in

# Web app (static Expo export)
server {
    listen 80;
    server_name xtanbot.lunarnodes.co.in;
    root /var/www/xtanbot;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}

# API (+ Twilio webhooks and media-stream websocket)
server {
    listen 80;
    server_name xtanbot-api.lunarnodes.co.in;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
