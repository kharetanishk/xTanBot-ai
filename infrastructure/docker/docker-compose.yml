version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: xtanbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: xtanbot
      POSTGRES_PASSWORD: xtanbot_secret
      POSTGRES_DB: xtanbot
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xtanbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: xtanbot_redis
    restart: unless-stopped
    command: redis-server --requirepass xtanbot_secret --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "xtanbot_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
